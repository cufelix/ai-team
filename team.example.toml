# AI tým: role, projekty, rozvrh a úsporný režim.
# Úpravy se projeví po restartu `ai-team serve`.

[server]
port = 7777
# Odkaz, který jde do kalendáře/notifikací (změň na Tailscale/LAN adresu, pokud chceš z mobilu).
public_url = "http://localhost:7777"

[budget]
# Tým běží na Max 5x: efektivně, ale s rezervou pro tvou ruční práci.
max_concurrent = 2          # kolik dev agentů běží najednou
max_dev_runs_per_day = 12   # strop autonomních dev běhů za den
plan_every_hours = 12       # jak často manažer přeplánuje projekt
tick_minutes = 20           # jak často se orchestrátor probudí
pause_if_block_cost_usd = 40.0  # aktivní 5h blok dražší než tohle (ccusage) → pauza
quiet_hours = []            # např. [9,10,11] = v tyhle hodiny agenti nemakají (ty pracuješ ručně)
dev_model = "sonnet"
plan_model = "sonnet"
meeting_model = "sonnet"
dev_timeout_minutes = 45

[standup]
days = ["Mon", "Wed", "Fri"]   # povinné meetingy
time = "09:30"
minutes = 20
timezone_offset = "+01:00"

[notify]
desktop = true
ntfy_topic = ""   # volitelné: náhodný název topicu na ntfy.sh → push na mobil (appka ntfy)

# voice = ElevenLabs voice_id (GET /v2/voices). Pro češtinu vyber české hlasy z Voice Library.
